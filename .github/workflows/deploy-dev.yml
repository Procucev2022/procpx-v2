name: Deploy dev to Cloudflare

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Quality checks, migrate D1, and deploy
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 60
    env:
      CI: true
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace quality gate
        run: npm run check:quality

      - name: Check remote D1 integrity before migration
        run: npm run db:integrity:remote

      - name: Apply reviewed D1 migrations
        run: npm run db:d1:migrate:remote

      - name: Verify remote D1 integrity after migration
        run: npm run db:integrity:remote

      - name: Deploy OpenNext application
        run: npm run cf:deploy
